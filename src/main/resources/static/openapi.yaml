openapi: 3.0.3
info:
  title: Product Service API
  description: This is the REST API for Product Service
  version: v0.0.1
  license:
    name: Apache 2.0
externalDocs:
  description: You can refer to the Product Service Wiki Documentation
  url: https://product-service-dummy-url.com/docs
servers:
  - url: http://localhost:8080
    description: Local development server
paths:
  /api/product/all:
    get:
      summary: Get all products
      description: Retrieve a list of all available products
      operationId: getAllProducts
      responses:
        '200':
          description: List of products
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProductResponse'
              examples:
                products:
                  value:
                    - id: "507f1f77bcf86cd799439011"
                      name: "iPhone 15 Pro"
                      description: "Latest iPhone with titanium design"
                      skuCode: "IPHONE15-PRO-128"
                      price: "999.99"
                    - id: "507f1f77bcf86cd799439012"
                      name: "MacBook Pro"
                      description: "Professional laptop"
                      skuCode: "MACBOOK-PRO-16"
                      price: "2499.00"
  /api/product/add:
    post:
      summary: Create a new product
      description: Add a new product to the system
      operationId: createProduct
      requestBody:
        description: Product information to be added
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddProductRequest'
            examples:
              iphone:
                summary: iPhone Example
                value:
                  name: "iPhone 15 Pro"
                  description: "Latest iPhone with titanium design"
                  skuCode: "IPHONE15-PRO-128"
                  price: "999.99"
      responses:
        '201':
          description: Product created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductResponse'
              examples:
                created:
                  value:
                    id: "507f1f77bcf86cd799439011"
                    name: "iPhone 15 Pro"
                    description: "Latest iPhone with titanium design"
                    skuCode: "IPHONE15-PRO-128"
                    price: "999.99"
components:
  schemas:
    AddProductRequest:
      type: object
      required:
        - name
        - description
        - skuCode
        - price
      properties:
        name:
          type: string
          example: "iPhone 15 Pro"
        description:
          type: string
          example: "Latest iPhone with titanium design"
        skuCode:
          type: string
          example: "IPHONE15-PRO-128"
        price:
          type: string
          format: decimal
          example: "999.99"
    ProductResponse:
      type: object
      properties:
        id:
          type: string
          example: "507f1f77bcf86cd799439011"
        name:
          type: string
          example: "iPhone 15 Pro"
        description:
          type: string
          example: "Latest iPhone with titanium design"
        skuCode:
          type: string
          example: "IPHONE15-PRO-128"
        price:
          type: string
          format: decimal
          example: "999.99" 