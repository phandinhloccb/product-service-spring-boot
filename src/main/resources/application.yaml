spring:
  application:
    name: product-service
  data:
    mongodb:
      host: localhost
      port: 27017
      database: product-service
      username: admin
      password: password
      authentication-database: admin
      authentication-mechanism: SCRAM-SHA-1
      uri: mongodb://admin:password@localhost:27017/product-service?authSource=admin

server:
  port: 8080

# SpringDoc OpenAPI Configuration - API docs only
springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: true
  swagger-ui:
    enabled: false 
  show-actuator: false
  group-configs:
    - group: product-service
      paths-to-match: /api/product/**
      display-name: Product Service API